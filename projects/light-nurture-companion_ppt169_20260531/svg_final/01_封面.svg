  <text x="640" y="420" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" fill="#FDFCF9" fill-opacity="0.7" letter-spacing="2">先从一口水、一次起身、一次深呼吸开始。</text>

