  <text x="110" y="230" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1C3A2C">1. 输入层 — 紧急关键词检测</text>
  <text x="110" y="255" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#6D9C83">检测「自杀」「胸痛」「呼吸困难」等 10+ 紧急关键词</text>
  <text x="110" y="278" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#6D9C83">触发后不调用 AI，直接返回安全引导信息，建议拨打 120</text>

  
