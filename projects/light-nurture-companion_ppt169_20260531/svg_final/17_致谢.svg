<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bgGradEnd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C3A2C"/>
      <stop offset="50%" stop-color="#244737"/>
      <stop offset="100%" stop-color="#1C3A2C"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1280" height="720" fill="url(#bgGradEnd)"/>

  <!-- Corner dots (mirror of cover) -->
  <circle cx="80" cy="80" r="5" fill="#498268" fill-opacity="0.3"/>
  <circle cx="1200" cy="80" r="5" fill="#498268" fill-opacity="0.3"/>
  <circle cx="80" cy="640" r="5" fill="#498268" fill-opacity="0.3"/>
  <circle cx="1200" cy="640" r="5" fill="#498268" fill-opacity="0.3"/>

  <!-- Top decorative line -->
  <rect x="565" y="180" width="150" height="1" fill="#498268" fill-opacity="0.4"/>

  <!-- Main title -->
  <text x="640" y="270" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="52" font-weight="bold" fill="#FDFCF9" letter-spacing="16">感谢聆听</text>

  <!-- Bottom decorative line -->
  <rect x="565" y="310" width="150" height="1" fill="#498268" fill-opacity="0.4"/>

  <!-- Brand tagline -->
  <text x="640" y="380" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="18" fill="#9BBBA8" letter-spacing="4">轻养伴侣</text>
  <text x="640" y="420" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#9BBBA8" fill-opacity="0.7">今天不用一下子变得很健康</text>
  <text x="640" y="448" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#9BBBA8" fill-opacity="0.7">先从一口水、一次起身、一次深呼吸开始</text>

  <!-- Bottom text -->
  <text x="640" y="540" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" fill="#FDFCF9" fill-opacity="0.8">欢迎提问 🙋</text>
  <text x="640" y="575" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#9BBBA8">联系方式：________</text>

  <!-- Page number -->
  <text x="1220" y="700" text-anchor="end" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="11" fill="#9BBBA8">17 / 17</text>
</svg>