<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#FDFCF9"/>

  <!-- Title + module tag -->
  <rect x="80" y="45" width="50" height="24" rx="12" fill="#D85C7E"/>
  <text x="105" y="62" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#FDFCF9">模块四</text>
  <text x="145" y="63" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="28" font-weight="bold" fill="#1C3A2C">情绪安放 — 先接住感受，再慢慢决定要不要行动</text>
  <rect x="145" y="78" width="50" height="3" rx="1.5" fill="#D85C7E"/>

  <!-- Feature list -->
  <circle cx="115" cy="130" r="4" fill="#D85C7E"/>
  <text x="135" y="136" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1C3A2C">情绪性进食识别</text>
  <text x="135" y="158" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#6D9C83">选择情绪标签（10种）+ 饥饿等级 → AI 温柔建议</text>

  <circle cx="115" cy="198" r="4" fill="#D85C7E"/>
  <text x="135" y="204" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1C3A2C">情绪树洞</text>
  <text x="135" y="226" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#6D9C83">自由书写，支持语音输入（Web Speech API），AI 温柔不评判</text>

  <circle cx="115" cy="266" r="4" fill="#D85C7E"/>
  <text x="135" y="272" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" font-weight="bold" fill="#D85C7E">危机检测 🆘</text>
  <text x="135" y="294" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#D85C7E">识别自杀/自伤等紧急表述 → 自动引导拨打 120 或心理援助热线</text>

  <circle cx="115" cy="334" r="4" fill="#D85C7E"/>
  <text x="135" y="340" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1C3A2C">AI 安全管线</text>
  <text x="135" y="362" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#6D9C83">三层过滤：输入检测 → 输出过滤 → XSS 防护</text>

  <circle cx="115" cy="402" r="4" fill="#D85C7E"/>
  <text x="135" y="408" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1C3A2C">温柔语录收藏</text>
  <text x="135" y="430" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#6D9C83">把 AI 感动瞬间收藏，可回看</text>

  <!-- Security highlight card -->
  <rect x="80" y="470" width="4" height="60" rx="2" fill="#D85C7E"/>
  <rect x="80" y="470" width="600" height="60" rx="10" fill="#FDF6F8"/>
  <text x="110" y="496" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" font-weight="bold" fill="#D85C7E">安全设计 ⚠</text>
  <text x="110" y="518" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="13" fill="#72263A">三层安全管线：输入检测 → 输出过滤 → XSS 防护。紧急情况不调用 AI，直接返回安全引导。</text>

  <!-- Right: screenshot placeholder -->
  <rect x="720" y="120" width="200" height="370" rx="18" fill="none" stroke="#E5D9C3" stroke-width="2" stroke-dasharray="8,4"/>
  <rect x="740" y="160" width="160" height="300" rx="8" fill="#F4F7F5" stroke="#E5D9C3" stroke-width="1"/>
